<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <title data-i18n="nav_history.title">Lịch sử NAV</title>
        <link rel="stylesheet" href="nav-history.css" />
        <style>
            :root {
                --font-display: "EB Garamond", serif;
                --font-body: "Google Sans Flex", sans-serif;

                --color-accent: #cc0000;
                --color-black: #000;
                --color-white: #fff;
                --color-silver: #f4f4f4;
                --color-cream: #f4f2ed;

                --gray-100: #f0ede8;
                --gray-200: #e0ddd8;
                --gray-400: #9e9b96;
                --gray-600: #5a5754;
                --gray-800: #2a2825;
            }

            /* ── NAV HISTORY PAGE ──────────────────────────────────────── */

            body {
                font-family: var(--font-body);
                background: var(--color-white);
                color: var(--gray-800);
                margin: 0;
            }

            .container {
                max-width: 900px;
                margin: 40px auto;
                padding: 20px;
            }

            .back {
                color: var(--gray-400);
                text-decoration: none;
                font-size: 14px;
            }

            h1 {
                font-family: var(--font-display);
                font-size: 42px;
                margin: 20px 0;
            }

            /* FILTER */
            .filter {
                display: flex;
                gap: 20px;
                margin-bottom: 30px;
            }

            .input-group {
                display: flex;
                flex-direction: column;
            }

            .input-group label {
                font-size: 14px;
                color: var(--gray-600);
                margin-bottom: 6px;
            }

            .input-group input {
                padding: 10px 14px;
                border: 1px solid var(--gray-200);
                border-radius: 8px;
                background: var(--color-white);
                font-size: 14px;
            }

            /* TABLE */
            .table {
                background: transparent;
            }

            .table-header,
            .row {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                align-items: center;
            }

            .table-header {
                font-size: 14px;
                color: var(--gray-400);
                padding: 10px 0;
                border-bottom: 1px solid var(--gray-200);
            }

            .row {
                padding: 24px;
                border-bottom: 1px solid var(--gray-200);
            }

            .row:hover {
                background: var(--color-silver);
            }

            .row span {
                font-size: 16px;
            }

            /* CHANGE */
            .change {
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 10px;
            }

            .positive {
                color: #0a8f4b;
            }

            .negative {
                color: var(--color-accent);
            }

            /* BADGE */
            .badge {
                padding: 4px 10px;
                border-radius: 6px;
                font-size: 13px;
                font-weight: 500;
            }

            .badge.up {
                background: #dff5e8;
                color: #0a8f4b;
            }

            .badge.down {
                background: #fde5e5;
                color: var(--color-accent);
            }
        </style>
    </head>

    <body>
        <div class="container">
            <a href="#" class="back" onclick="history.back()">← Trở lại</a>

            <h1 data-i18n="nav_history.title">Lịch sử NAV</h1>

            <div class="table">
                <div class="table-header">
                    <span data-i18n="nav_history.th_month">Tháng</span>
                    <span data-i18n="nav_history.th_nav">Giá NAV</span>
                    <span data-i18n="nav_history.th_change">Thay đổi</span>
                </div>
                <div class="row">
                    <span>6/2026</span>
                    <span data-currency="30474.84">30,474.84 đ</span>
                    <span class="change negative">
                        <span class="badge down">▼ -5.51%</span>
                    </span>
                </div>

                <div class="row">
                    <span>5/2026</span>
                    <span data-currency="34152.86">34.152,86 đ</span>
                    <span class="change negative">
                        <span class="badge down">▼ -5.99%</span>
                    </span>
                </div>

                <div class="row">
                    <span>4/2026</span>
                    <span data-currency="38839.36">38.839,36 đ</span>
                    <span class="change positive">
                        <span class="badge up">▲ 3.02%</span>
                    </span>
                </div>

                <div class="row">
                    <span>03/2026</span>
                    <span data-currency="40912.06">40.912,06 đ</span>
                    <span class="change positive">
                        <span class="badge up">▲ 2.58%</span>
                    </span>
                </div>

                <div class="row">
                    <span>02/2026</span>
                    <span data-currency="39916.58">39.916,58 đ</span>
                    <span class="change positive">
                        <span class="badge up">▲ 5.34%</span>
                    </span>
                </div>

                <div class="row">
                    <span>01/2026</span>
                    <span data-currency="38751.17">38.751,17 đ</span>
                    <span class="change negative">
                        <span class="badge down">▼ 5.13%</span>
                    </span>
                </div>
            </div>
        </div>

        <script type="module">
            import { initI18n } from "./assets/js/i18n.js";
            document.addEventListener("DOMContentLoaded", async () => {
                await initI18n();
            });
        </script>
    </body>
</html>
